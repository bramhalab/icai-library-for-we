  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(blocked(nx,ny)||pv[k(nx,ny)]!==undefined)continue;pv[k(nx,ny)]=k(x,y);q.push([nx,ny])}}return null}

 $("hLv").innerHTML="Lv "+lvl()+" <span class='bar'><i style='width:"+(S.xp%100)+"%'></i></span>";$("hStk").textContent="🔥 "+S.streak+" x"+(1+Math.min(S.streak,10)*.1).toFixed(1)}
const DAY=300,goal=()=>S.dayStart+1000+300*S.day;S.t=0;

function person(x,y,col,dir,step,hair,player){const c=cx,s=T,px=x*s,py=y*s,bob=Math.sin(step*10)*(step?s*.03:0),lg=Math.sin(step*10)*(step?s*.08:0);

function building(b){const c=cx,s=T,x=b.x*s,y=b.y*s,w=b.w*s,h=b.h*s,rh=h*.34;
 c.fillStyle="#0003";c.fillRect(x+4,y+4,w,h);c.fillStyle=b.wall;c.fillRect(x,y+rh,w,h-rh);c.fillStyle=b.roof;c.beginPath();c.moveTo(x-s*.2,y+rh);c.lineTo(x+s*.4,y);c.lineTo(x+w-s*.4,y);c.lineTo(x+w+s*.2,y+rh);c.fill();

let tm=0;
function draw(){const c=cx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);

function trial(){const rows=Object.keys(S.ledger).filter(k=>Math.abs(S.ledger[k])>.01).sort();let dr=0,cr=0;const t=rows.map(k=>{const v=S.ledger[k];if(v>0)dr+=v;else cr-=v;return"<tr><td>"+k+"</td><td>"+(v>0?Rs(v):"")+"</td><td>"+(v<0?Rs(-v):"")+"</td></tr>"}).join("");return rows.length?'<table class="tb"><tr><th>Account</th><th>Dr.</th><th>Cr.</th></tr>'+t+'<tr><td><b>Total</b></td><td><b>'+Rs(dr)+'</b></td><td><b>'+Rs(cr)+'</b></td></tr></table><p>'+(Math.abs(dr-cr)<.5?'✅ Trial balance <b>tallies</b>. Both sides are equal because every entry has equal debit and credit.':'⚠️ Does not tally')+'</p>':'<p class="mut">No entries yet. Serve customers at Ledger & Co. to build your books.</p>'}

 const weak=Object.entries(S.topics).filter(([k,v])=>v[1]>=2&&v[0]/v[1]<.6).map(([k,v])=>k+" ("+v[0]+"/"+v[1]+")");
 openM(hd(b,"")+'<div class="row2"><div><label>Cash</label><div class="big">'+Rs(S.cash)+'</div></div><div><label>Today\'s goal</label><div class="big">'+Rs(goal())+'</div></div></div><label>Your learning</label>'+bars+'<p>'+(weak.length?'🎯 <b>Revise:</b> '+weak.join(", "):'No weak topics yet - keep playing!')+'</p><label>Upgrades</label><button class="btn" id="u1">👟 Running shoes +25% speed - '+Rs(800+600*S.boots)+' (owned '+S.boots+')</button><button class="btn" id="u2">⏱ Wall clock: customers wait +30% - '+Rs(1200+800*S.clock)+' (owned '+S.clock+')</button><button class="btn" id="u3">💡 3 hint tokens - '+Rs(300)+' (have '+S.hints+')</button><label>Your books (Trial Balance)</label>'+trial()+'<button class="btn g" id="eod">End the day now</button><button class="btn g" id="rst">Reset game</button>');bindLeave();
 const buy=(id,cost,fn)=>$(id).onclick=()=>{if(S.cash<cost){toast("Not enough cash");return}S.cash-=cost;S.dayStart-=cost;fn();save();sOk();modHome(b)};buy("u1",800+600*S.boots,()=>S.boots++);buy("u2",1200+800*S.clock,()=>S.clock++);buy("u3",300,()=>S.hints+=3);
 $("eod").onclick=()=>{closeM();endDay()};$("rst").onclick=()=>{if(confirm("Delete all progress?")){S=fresh();S.t=0;R=[];save();closeM()}}}

function endDay(){if($("modal").classList.contains("on")){setTimeout(()=>{if(!$("modal").classList.contains("on"))endDay()},250);return;}const earned=S.cash-S.dayStart,ok=S.cash>=goal();let bonus=0;if(ok){bonus=500;S.cash+=bonus;S.xp+=30;S.rep=clamp(S.rep+.3,0,5)}else S.rep=clamp(S.rep-.3,0,5);
 const acc=Object.values(S.stats).reduce((a,v)=>[a[0]+v[0],a[1]+v[1]],[0,0]);cur=null;
 openM('<h2>🌙 Day '+S.day+' is over</h2><div class="res '+(ok?"ok":"bad")+'">'+(ok?'✅ Goal reached! Bonus '+Rs(bonus)+' +30 XP':'❌ Goal '+Rs(goal())+' missed. Reputation dropped. Serve more customers and watch the clocks.')+'</div><p>Earned today: <b>'+Rs(earned)+'</b> &nbsp; Accuracy overall: <b>'+(acc[1]?Math.round(acc[0]/acc[1]*100):0)+'%</b> &nbsp; Best streak: <b>'+S.best+'</b></p><label>Books at closing (Trial Balance)</label>'+trial()+'<button class="btn" id="nd">Start Day '+(S.day+1)+'</button>');
