<style>

*{box-sizing:border-box}[hidden]{display:none!important}

#body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}

const $=id=>document.getElementById(id),enc=p=>p.split("/").map(encodeURIComponent).join("/"),base=p=>p.split("/").pop();
let path="";try{path=decodeURIComponent(location.hash.slice(1))}catch(_){}

const S={ann:[],qs:[],hist:[],cur:null},COLORS=["#f7d417","#5fd35f","#ff7eb6","#4aa8ff","#e0352b","#111111"];
let pdf=null,pages=[],Z=1,tool="sel",color=COLORS[0],lw=.005,obs=null,showBoxes=true,imgHidden=true,timerOpen=false;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){if(typeof info==="function")info("Save failed — export a backup and free browser storage.",3500);return false}};
function validateBackup(o){
 if(!o||o.app!=="icai-library"||(o.v!==undefined&&![1,2,3].includes(o.v)))throw new Error("Unsupported backup format.");
 let source=o.pdfs;if(!source&&o.pdf)source={[o.pdf]:{saved:Date.now(),ann:o.ann||[],qs:o.qs||[]}};
 if(!source||typeof source!=="object"||Array.isArray(source))throw new Error("Backup has no PDF records.");
 const out={},paths=Object.keys(source);if(paths.length>10000)throw new Error("Backup has too many PDF records.");
 for(const p of paths){
  if(!p||p.length>2000||/[\u0000-\u001f]/.test(p)||p.split("/").some(seg=>seg===".."||["__proto__","prototype","constructor"].includes(seg.toLowerCase())))throw new Error("Backup contains an invalid PDF path.");
  const r=source[p];if(!r||typeof r!=="object"||!Array.isArray(r.ann||[])||!Array.isArray(r.qs||[]))throw new Error("Backup contains an invalid PDF record.");
  const ids=new Set(),qs=[];if(r.qs.length>20000||(r.ann||[]).length>200000)throw new Error("A backup record is too large.");

function renderQs(){const ch=$("chips");ch.innerHTML="";S.qs.forEach(q=>{const b=document.createElement("button");b.textContent=q.label;b.className=q.id===S.cur?"on":"";b.onclick=()=>openQ(q.id);ch.append(b)});
 const q=S.qs.find(z=>z.id===S.cur);$("qhead").hidden=$("wk").hidden=!q;$("qimg").hidden=!q||imgHidden;$("qpeek").hidden=!q;$("qnone").hidden=!!q;$("qtimer").hidden=!q||!timerOpen;if(q){$("qlab").value=q.label;tShow()}}
$("qlab").oninput=()=>{const q=S.qs.find(z=>z.id===S.cur);if(q){q.label=$("qlab").value;persist();renderQs();redrawAll()}};
const delQ=()=>{const q=S.qs.find(z=>z.id===S.cur);if(!q)return;
 tStop();S.qs=S.qs.filter(z=>z!==q);S.hist=S.hist.filter(h=>h[1]!==q);try{localStorage.removeItem("pg:"+path+"::"+q.id)}catch(e){}
 S.cur=null;$("wk").dataset.k="";$("wk").src="about:blank";persist();redrawAll();if(S.qs.length)openQ(S.qs[0].id);else{renderQs();showSide(false)}};
function twoTap(btn,fn){let t=0;const t0=btn.title;btn.onclick=()=>{if(t){clearTimeout(t);t=0;btn.classList.remove("warn");btn.title=t0;fn();return}btn.classList.add("warn");btn.title="Tap again to delete this question and its work";info("Tap the bin again to delete",1800);t=setTimeout(()=>{t=0;btn.classList.remove("warn");btn.title=t0},2500)}}
twoTap($("qdel"),delQ);

/* ---------- optional timer (per question; time spent is saved with the question) ---------- */
const PLAY='<path d="M7 4l13 8-13 8z"/>',PAUSE='<path d="M8 5v14M16 5v14" stroke-width="3"/>',TIMER='<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5V6"/>',RESET='<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>';
let tId=null,tBase=0,tT0=0;
const mmss=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
function beep(){try{if(localStorage.getItem("mute")==="1")return}catch(_){}try{const a=new(window.AudioContext||window.webkitAudioContext)();[880,1100,880].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.22;o.frequency.value=f;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function tShow(){const q=S.qs.find(z=>z.id===S.cur);if(!q)return;const sp=q.spent||0,lim=(q.limit||0)*60,v=lim?lim-sp:sp;
 $("tdisp").textContent=(v<0?"+":"")+mmss(Math.abs(v));$("tdisp").classList.toggle("over",lim>0&&v<0);
 $("tplay").innerHTML=ic(tId?PAUSE:PLAY);$("tplay").title=$("tplay").ariaLabel=tId?"Pause":"Start";$("qtog").classList.toggle("on",!!tId||timerOpen);
 document.querySelectorAll("#tlims button").forEach(b=>b.classList.toggle("on",+b.dataset.m===(q.limit||0)))}
function tStop(){if(tId){clearInterval(tId);tId=null;persist()}tShow()}
function tStart(){const q=S.qs.find(z=>z.id===S.cur);if(!q||tId)return;tBase=q.spent||0;tT0=Date.now();
 tId=setInterval(()=>{const qq=S.qs.find(z=>z.id===S.cur);if(!qq){tStop();return}const old=qq.spent||0,lim=(qq.limit||0)*60;
  qq.spent=tBase+Math.floor((Date.now()-tT0)/1000);if(lim&&old<lim&&qq.spent>=lim)beep();tShow();if(qq.spent!==old&&qq.spent%10===0)persist()},400);tShow()}
$("qtog").innerHTML=ic(TIMER);$("trst").innerHTML=ic(RESET);
$("qtog").onclick=()=>{timerOpen=!timerOpen;$("qtimer").hidden=!timerOpen||!S.qs.some(z=>z.id===S.cur);tShow()};
$("tplay").onclick=()=>tId?tStop():tStart();
$("trst").onclick=()=>{const q=S.qs.find(z=>z.id===S.cur);if(!q)return;tStop();q.spent=0;persist();tShow()};
[[0,"\u221e","Stopwatch (no time limit)"],[5,"5","5 minute limit"],[10,"10","10 minute limit"],[15,"15","15 minute limit"],[20,"20","20 minute limit"]].forEach(([m,t,h])=>{const b=document.createElement("button");b.dataset.m=m;b.textContent=t;b.title=b.ariaLabel=h;
 b.onclick=()=>{const q=S.qs.find(z=>z.id===S.cur);if(q){q.limit=m;persist();tShow()}};$("tlims").append(b)});
addEventListener("pagehide",()=>tStop());

/* ---------- save / load work (JSON) ---------- */
$("save").onclick=()=>{tStop();downloadAll(collectAll())};
$("load").onclick=()=>$("lf").click();
$("lf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{if(f.size>50*1024*1024)throw new Error("Backup is larger than 50 MB.");const o=JSON.parse(await f.text());const r=applyAll(o);info("Imported "+r.pdfs+" PDF(s), "+r.questions+" question(s); skipped "+r.skipped+" newer/equal local record(s).",3500);setTimeout(()=>location.reload(),1200)}catch(err){info(err&&err.message?err.message:"Invalid backup file; no changes imported.",3500)}};

/* ---------- start ---------- */
(async()=>{
 if(!path){pagesEl.innerHTML='<div class="msg">Koi PDF chuni nahi gayi.</div>';return}
 const sv=lsGet("rd:"+path);if(sv){S.ann=sv.ann||[];S.qs=sv.qs||[]}
 try{pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER;
  pdf=await pdfjsLib.getDocument({url:RAW+enc(path)}).promise;
  vps=[];for(let base=1;base<=pdf.numPages;base+=20){const end=Math.min(pdf.numPages,base+19),batch=[];for(let n=base;n<=end;n++)batch.push((async()=>{const v=(await pdf.getPage(n)).getViewport({scale:1});return{w:v.width,h:v.height}})());vps.push(...await Promise.all(batch))}
  buildPages();renderQs();if(S.qs.length){showSide(true);openQ(S.qs[0].id)}}
 catch(e){console.warn(e);pagesEl.textContent="";const m=document.createElement("div");m.className="msg";m.textContent="PDF load nahi hui. Internet check karo, ya upar New tab se kholo. "+String(e&&e.message||e);pagesEl.append(m)}
})();
</script></body></html>
