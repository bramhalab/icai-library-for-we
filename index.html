<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICAI Study Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ef;--card:#fbfcf9;--ink:#17261f;--mute:#667068;--line:#d5dbd0;--rule:#c8372d;--acc:#1f5d4a;--accbg:#e1ece6}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--card:#19231e;--ink:#e6ece5;--mute:#93a096;--line:#2a3830;--rule:#e0574c;--acc:#6cc2a2;--accbg:#203a30}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--rule);padding-bottom:10px}
h1{font:700 26px/1.1 Newsreader,Georgia,serif;margin:0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:14px 0 6px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:14px;color:var(--mute);margin:10px 0 4px}
.crumbs a{color:var(--acc);cursor:pointer;text-decoration:none;font-weight:500}
.crumbs a:hover{text-decoration:underline}
.sec{font:700 13px Newsreader,serif;color:var(--mute);margin:18px 0 4px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
li:first-child{border-top:0}
li:hover{background:var(--accbg)}
li .n{flex:1;overflow-wrap:anywhere}
li .m{font-size:13px;color:var(--mute);white-space:nowrap}
.ic{width:22px;text-align:center;color:var(--acc);font-size:18px}
.dir .n{font-weight:500}
.msg{padding:28px 8px;color:var(--mute);text-align:center}
.where{font-size:12px;color:var(--mute);margin-left:0}
#viewer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0)}
#viewer.on{display:flex}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#bar a{color:var(--acc);font-weight:700;text-decoration:none;padding:6px 10px}
iframe{flex:1;border:0;width:100%;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ICAI Study Library</h1>
    <button id="mute" aria-label="Toggle sound">Sound on</button>
  </header>
  <input id="q" type="search" placeholder="Search all files, e.g. MTP AUG 25 law" autocomplete="off">
  <nav class="crumbs" id="crumbs"></nav>
  <main id="list"></main>
</div>
<div id="viewer">
  <div id="bar"><button id="close">Back</button><b id="vt"></b><a id="vo" target="_blank" rel="noopener">Open in new tab</a></div>
  <iframe id="vf" title="PDF viewer"></iframe>
</div>
<script>
const REPO="Brand1809/ICAI_SM_CFA", API="https://huggingface.co/api/datasets/"+REPO+"/tree/main",
      RAW="https://huggingface.co/datasets/"+REPO+"/resolve/main/";
const $=id=>document.getElementById(id), enc=p=>p.split("/").map(encodeURIComponent).join("/");
const collator=new Intl.Collator(undefined,{numeric:true,sensitivity:"base"});
const cache={}; let all=null, path="";

/* sound: tiny synthesized clicks, no audio files */
let ctx, muted=localStorage.getItem("mute")==="1";
function setMuteLabel(){$("mute").textContent=muted?"Sound off":"Sound on"}
function tone(f,d,t="sine",v=.08){if(muted)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
const snd={dir:()=>tone(520,.12,"triangle"),back:()=>tone(340,.12,"triangle"),file:()=>{tone(660,.1);setTimeout(()=>tone(880,.14),90)}};
$("mute").onclick=()=>{muted=!muted;localStorage.setItem("mute",muted?"1":"0");setMuteLabel();tone(600,.1)};
setMuteLabel();

async function listDir(p){
  if(cache[p])return cache[p];
  const r=await fetch(API+(p?"/"+enc(p):"")); if(!r.ok)throw new Error(r.status);
  const d=(await r.json()).filter(x=>x.type==="directory"||x.type==="file");
  return cache[p]=d;
}
async function loadAll(){
  if(all)return all; let url=API+"?recursive=true&limit=1000", out=[];
  while(url){const r=await fetch(url); if(!r.ok)throw new Error(r.status); out=out.concat(await r.json());
    const m=(r.headers.get("link")||"").match(/<([^>]+)>;\s*rel="next"/); url=m?m[1]:null}
  return all=out.filter(x=>x.type==="file");
}
const base=p=>p.split("/").pop(), size=b=>b>1e6?(b/1e6).toFixed(1)+" MB":Math.max(1,Math.round(b/1e3))+" KB";
const hidden=n=>n.startsWith(".")||n==="README.md";

function row(x,showPath){
  const dir=x.type==="directory", li=document.createElement("li"); li.tabIndex=0; if(dir)li.className="dir";
  const where=showPath?'<div class="where">'+x.path.split("/").slice(0,-1).join(" / ")+"</div>":"";
  li.innerHTML='<span class="ic">'+(dir?"&#128193;":"&#128196;")+'</span><span class="n"></span><span class="m">'+(dir?"":size(x.size||0))+"</span>";
  li.querySelector(".n").textContent=base(x.path); if(showPath)li.querySelector(".n").insertAdjacentHTML("beforeend",where);
  const go=()=>dir?nav(x.path,"dir"):openFile(x.path);
  li.onclick=go; li.onkeydown=e=>{if(e.key==="Enter")go()}; return li;
}
function crumbs(){
  const c=$("crumbs"); c.innerHTML=""; const parts=path?path.split("/"):[];
  const a=document.createElement("a"); a.textContent="Library"; a.onclick=()=>nav("","back"); a.tabIndex=0; c.append(a);
  parts.forEach((s,i)=>{c.append(" / "); const t=document.createElement(i==parts.length-1?"span":"a"); t.textContent=s;
    if(i<parts.length-1){t.onclick=()=>nav(parts.slice(0,i+1).join("/"),"back");t.tabIndex=0} c.append(t)});
}
async function render(){
  $("q").value=""; crumbs(); const L=$("list"); L.innerHTML='<div class="msg">Loading...</div>';
  try{
    const items=(await listDir(path)).filter(x=>!hidden(base(x.path)))
      .sort((a,b)=>(a.type===b.type?0:a.type==="directory"?-1:1)||collator.compare(base(a.path),base(b.path)));
    L.innerHTML=""; if(!items.length){L.innerHTML='<div class="msg">This folder is empty.</div>';return}
    if(!path){const rc=JSON.parse(localStorage.getItem("recent")||"[]");
      if(rc.length){L.insertAdjacentHTML("beforeend",'<div class="sec">Continue reading</div>');const u=document.createElement("ul");
        rc.forEach(p=>u.append(row({type:"file",path:p,size:0},true)));L.append(u);L.insertAdjacentHTML("beforeend",'<div class="sec">All folders</div>')}}
    const u=document.createElement("ul"); items.forEach(x=>u.append(row(x))); L.append(u);
  }catch(e){L.innerHTML='<div class="msg">Could not load this folder. Check your internet and refresh the page.</div>'}
}
function nav(p,s){path=p;history.pushState({p},"","#"+enc(p));snd[s]();render();window.scrollTo(0,0)}
addEventListener("popstate",e=>{path=(e.state&&e.state.p)||decodeURIComponent(location.hash.slice(1));closeV();render()});

function openFile(p){
  snd.file(); let rc=JSON.parse(localStorage.getItem("recent")||"[]").filter(x=>x!==p); rc.unshift(p); localStorage.setItem("recent",JSON.stringify(rc.slice(0,5)));
  const url=RAW+enc(p); $("vt").textContent=base(p); $("vo").href=url;
  if(/\.pdf$/i.test(p)){$("vf").src=url;$("viewer").classList.add("on")}else window.open(url,"_blank");
}
function closeV(){$("viewer").classList.remove("on");$("vf").src="about:blank"}
$("close").onclick=()=>{snd.back();closeV()};

let tm; $("q").addEventListener("input",e=>{clearTimeout(tm);const v=e.target.value.trim().toLowerCase(); if(!v){render();return}
  tm=setTimeout(async()=>{const L=$("list"); L.innerHTML='<div class="msg">Searching...</div>';
    try{const words=v.split(/\s+/),hits=(await loadAll()).filter(x=>!hidden(base(x.path))&&words.every(w=>x.path.toLowerCase().includes(w))).slice(0,80);
      L.innerHTML=""; if(!hits.length){L.innerHTML='<div class="msg">No file matches "'+v.replace(/</g,"")+'". Try fewer words.</div>';return}
      const u=document.createElement("ul"); hits.forEach(x=>u.append(row(x,true))); L.append(u)}
    catch(err){L.innerHTML='<div class="msg">Search failed. Refresh and try again.</div>'}},300)});

path=decodeURIComponent(location.hash.slice(1)); render();
</script>
</body>
</html>
