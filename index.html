<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA Foundation Library</title>
<style>
:root{--paper:#F3EEE2;--dark:#E8E0CC;--ink:#1E2A38;--soft:#4A5568;--ledger:#8C6B3F;--acc:#1E4D6B;--rule:#C9BEA0;--card:#FBF8F0}
@media (prefers-color-scheme:dark){:root{--paper:#1b1f26;--dark:#252b34;--ink:#ece6d6;--soft:#a9b0bb;--ledger:#d2a869;--acc:#7fb8d9;--rule:#3a424e;--card:#222831}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 Georgia,'Iowan Old Style',serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100%;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:14px 16px;border-bottom:3px double var(--ledger);border-right:1px solid var(--rule);font:700 19px Palatino,Georgia,serif;background:var(--card)}
.brand small{display:block;font:11px 'Courier New',monospace;color:var(--soft);font-weight:400}
.top{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:3px double var(--ledger);background:var(--card)}
#q{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:2px;padding:9px 12px}
.pill{background:transparent;border:1.5px solid var(--acc);color:var(--acc);padding:6px 10px;border-radius:2px;font:12px 'Courier New',monospace;white-space:nowrap}
#fbtn{display:none}
#side{overflow:auto;border-right:1px solid var(--rule);background:var(--card);padding:8px 0 30px}
#main{overflow:auto;padding:16px 22px calc(40px + env(safe-area-inset-bottom,0px))}
.h{font:700 11px 'Courier New',monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--ledger);padding:12px 14px 6px}
.node{display:flex;align-items:center;gap:4px;padding:6px 10px;cursor:pointer;font-size:14.5px;min-height:34px}
.node:hover{background:var(--dark)}
.node.on{background:var(--dark);box-shadow:inset 3px 0 0 var(--acc);font-weight:700}
.tg{width:18px;text-align:center;color:var(--ledger);flex:none}
.nm{flex:1;overflow-wrap:anywhere}
.crumbs{font:13px 'Courier New',monospace;color:var(--soft);margin-bottom:12px;overflow-wrap:anywhere}
.crumbs a{color:var(--acc);cursor:pointer;text-decoration:underline dotted}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:8px}
.sub{background:var(--card);border:1px solid var(--rule);box-shadow:2px 3px 0 var(--rule);padding:14px;text-align:left;border-radius:2px}
.sub:active{transform:translate(2px,3px);box-shadow:none}
.sub .p{border:1px solid var(--ledger);color:var(--ledger);font:11px 'Courier New',monospace;padding:1px 7px}
.sub h2{font:700 18px Palatino,Georgia,serif;margin:8px 0 2px;color:var(--acc)}
.mono{font:12px 'Courier New',monospace;color:var(--soft)}
ul{list-style:none;margin:0 0 18px;padding:0;background:var(--card);border:1px solid var(--rule);box-shadow:2px 3px 0 var(--rule)}
li{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--rule);cursor:pointer;min-height:46px}
li:first-child{border-top:0}
li:hover{background:var(--dark)}
li .n{flex:1;overflow-wrap:anywhere}
li small{display:block;color:var(--soft);font:11px 'Courier New',monospace}
li .m{font:12px 'Courier New',monospace;color:var(--ledger);white-space:nowrap}
.msg{padding:26px 8px;text-align:center;color:var(--soft)}
.btn{background:var(--acc);color:var(--paper);border:0;padding:8px 16px;border-radius:2px;box-shadow:2px 2px 0 var(--ink);text-decoration:none;font:14px Palatino,Georgia,serif}
#viewer{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px)}
#viewer.on{display:flex}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:3px double var(--ledger)}
#bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{flex:1;border:0;width:100%;background:#fff}
@media(max-width:760px){
 .app{grid-template-columns:1fr}.brand{display:none}
 #fbtn{display:block}
 #side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);z-index:10;transform:translateX(-102%);transition:transform .2s;padding-top:calc(8px + env(safe-area-inset-top,0px));box-shadow:4px 0 0 var(--rule)}
 #side.open{transform:none}
 #main{padding:14px 12px 40px}}
@media(prefers-reduced-motion:reduce){#side{transition:none}}

.subs{display:none!important}
#modes{display:none}.prac #modes{display:inline-flex}
#modes button{background:var(--card);border:1px solid var(--acc);padding:6px 10px;font:12px 'Courier New',monospace;color:var(--acc)}
#modes button.on{background:var(--acc);color:var(--paper)}
#stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
#stage iframe{width:100%;height:100%;min-height:0}
#pg{overflow:auto;background:var(--paper);border-left:3px double var(--ledger);padding:10px;min-height:0}
.m-pdf #pg{display:none}.m-work #vf{display:none}.m-split #stage{grid-template-columns:1fr 1fr}
@media(max-width:900px){.m-split #stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}#pg{border-left:0;border-top:3px double var(--ledger)}}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{background:var(--card);border:1.5px solid var(--rule);padding:6px 12px;font:13px Palatino,Georgia,serif}.tabs button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
#notes{width:100%;min-height:55vh;font:15px/1.6 'Courier New',monospace;color:var(--ink);background:var(--card) linear-gradient(var(--rule) 1px,transparent 1px) 0 0/100% 24px;border:1px solid var(--rule);padding:8px;resize:vertical}
#cmd{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--acc);padding:9px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--ledger);background:var(--card);padding:3px 10px;font-size:13px;cursor:pointer;border-radius:14px}
.acard{background:var(--card);border:1px solid var(--rule);box-shadow:2px 3px 0 var(--rule);padding:10px;margin:10px 0}
.ah{display:flex;justify-content:space-between;align-items:center}.ah b{font:700 16px Palatino,Georgia,serif;color:var(--acc)}
.ah button,.r button{background:transparent;border:0;font-size:18px;color:var(--soft);padding:0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.two.one{grid-template-columns:1fr}
.sh{font:700 12px 'Courier New',monospace;color:var(--ledger);border-bottom:2px solid var(--ledger);padding-bottom:3px;margin-bottom:4px}
.r{display:flex;gap:3px;margin-bottom:3px}.r input{min-width:0;font:13px Georgia,serif;color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:5px}
.r .lb{flex:2}.r .am{flex:1;text-align:right;font-family:'Courier New',monospace}
.add{background:transparent;border:1px dashed var(--ledger);color:var(--ledger);font:12px 'Courier New',monospace;padding:3px 8px;margin:4px 0}
.tot{font:700 13px 'Courier New',monospace;text-align:right;border-top:2px solid var(--ink);padding-top:3px}
.chk{font:12px 'Courier New',monospace;margin-top:6px;color:var(--soft)}.chk.ok{color:#2F6B4F;font-weight:700}
.acard details{margin-top:6px;font-size:13px;color:var(--soft)}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.calc{width:min(100%,340px);margin:6px auto;background:#25232a;border-radius:12px;padding:14px;color:#fff;font-family:system-ui,sans-serif;box-shadow:0 4px 0 #111}
.cb{font-weight:700;font-size:13px;display:flex;justify-content:space-between;color:#ccc;margin-bottom:6px}
.lcdw{background:#cfd8d4;color:#111;border-radius:4px;padding:6px 10px;box-shadow:inset 0 2px 5px #0006;height:74px;position:relative;overflow:hidden}
#ind{font:700 11px 'Courier New',monospace;min-height:14px}#lcd{font:34px 'Courier New',monospace;text-align:right;position:absolute;right:10px;bottom:4px;white-space:nowrap}
#tape{background:#cfd8d4;color:#111;font:12px 'Courier New',monospace;max-height:90px;overflow:auto;margin-top:6px;padding:4px 8px;border-radius:4px}#tape .on{background:#111;color:#cfd8d4}
.kg{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.kg button{height:40px;border:0;border-radius:6px;background:#3d3d43;color:#eee;font:17px system-ui,sans-serif;box-shadow:0 3px 0 #111;padding:0}
.kg button:active{transform:translateY(2px);box-shadow:none}
.kg .sm{font-size:9px;line-height:1.1}.kg .pu{background:#7a1f6e}.kg .p{grid-row:span 2;height:auto}.kg .lt{background:#e5e5e5;color:#222}
.kg i{display:block}.cap{grid-column:5/7;text-align:center;font:9px system-ui;color:#ccc;align-self:end}
</style>
</head>
<body>
<div class="app">
  <div class="brand">CA Foundation Library<small>ICAI study material</small></div>
  <div class="top"><button class="pill" id="fbtn">Folders</button><input id="q" type="search" placeholder="Search: law aug 25, economics RTP" autocomplete="off"><button class="pill" id="ed" title="Study material edition">Edition</button><button class="pill" id="mute">Sound on</button></div>
  <nav id="side" aria-label="Folders"></nav>
  <main id="main"></main>
</div>
<div id="viewer" class="m-pdf"><div id="bar"><button class="btn" id="close">Back</button><b id="vt"></b><span id="modes"><button data-m="pdf" class="on">PDF</button><button data-m="split">Split</button><button data-m="work">Practice</button></span><a class="btn" id="vo" target="_blank" rel="noopener">New tab</a></div><div id="stage"><iframe id="vf" title="PDF"></iframe><section id="pg" aria-label="Practice playground"></section></div></div>
<script>
const REPO="Brand1809/ICAI_SM_CFA",API="https://huggingface.co/api/datasets/"+REPO+"/tree/main",RAW="https://huggingface.co/datasets/"+REPO+"/resolve/main/";
const $=id=>document.getElementById(id),enc=p=>p.split("/").map(encodeURIComponent).join("/"),base=p=>p.split("/").pop(),par=p=>p.split("/").slice(0,-1).join("/");
const NC=new Intl.Collator(undefined,{numeric:true,sensitivity:"base"});
const SUBJ=[{id:"acc",p:"Paper 1",name:"Accounting",re:/\b(accounting|accounts?|acc)\b/i},
 {id:"law",p:"Paper 2",name:"Business Laws",re:/\b(business laws?|laws?)\b/i},
 {id:"qa",p:"Paper 3",name:"Quantitative Aptitude",re:/\b(quantitative|aptitude|qa|maths?|mathematics|stats?|statistics|lr|logical)\b/i},
 {id:"eco",p:"Paper 4",name:"Business Economics",re:/\b(economics|eco|bck|commercial)\b/i}];
let files=[],ch={},cnt={},exp=new Set(),cur={t:"d",id:"",p:""};

/* sound */
let ac,muted=localStorage.getItem("mute")==="1";
const A=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac};
function note(f,t0,d,type="sine",v=.3){const c=A(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d)}
function swish(a,b,d=.22,v=.5){const c=A(),n=Math.floor(c.sampleRate*d),bf=c.createBuffer(1,n,c.sampleRate),x=bf.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
 const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;s.buffer=bf;f.type="bandpass";f.Q.value=1.2;f.frequency.setValueAtTime(a,t);f.frequency.exponentialRampToValueAtTime(b,t+d);g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start()}
const SND={dir:()=>swish(500,2600),back:()=>swish(2600,500),subj:()=>{note(120,0,.25,"sine",.7);note(70,.02,.3,"sine",.7);swish(900,300,.1,.3)},
 file:()=>{note(660,0,.25,"triangle");note(880,.09,.25,"triangle");note(1320,.18,.4,"triangle",.2)},tick:()=>note(1800,0,.04,"square",.06)};
const play=k=>{if(!muted)try{SND[k]()}catch(e){}};
const setMute=()=>$("mute").textContent=muted?"Sound off":"Sound on";
$("mute").onclick=()=>{muted=!muted;localStorage.setItem("mute",muted?"1":"0");setMute();play("file")};setMute();

/* data */
const clean=s=>s.replace(/[_\-\/().]/g," ");
const subjOf=p=>{for(const s of p.split("/")){const m=SUBJ.find(j=>j.re.test(clean(s)));if(m)return m.id}return"other"};
async function load(){let url=API+"?recursive=true&limit=1000",out=[];
 while(url){const r=await fetch(url);if(!r.ok)throw 0;out=out.concat(await r.json());const m=(r.headers.get("link")||"").match(/<([^>]+)>;\s*rel="next"/);url=m?m[1]:null}
 files=out.filter(x=>x.type==="file"&&/\.pdf$/i.test(x.path)&&!/ignore|ingnore/i.test(x.path)).map(x=>({...x,s:subjOf(x.path)}));
 const D=new Set();files.forEach(f=>{const p=f.path.split("/");for(let i=1;i<p.length;i++){const d=p.slice(0,i).join("/");D.add(d);cnt[d]=(cnt[d]||0)+1}});
 [...D].sort(NC.compare).forEach(d=>(ch[par(d)]=ch[par(d)]||[]).push(d))}
const size=b=>!b?"":b>1e6?(b/1e6).toFixed(1)+" MB":Math.max(1,Math.round(b/1e3))+" KB";
const msg=t=>Object.assign(document.createElement("div"),{className:"msg",textContent:t});
const ul=items=>{const u=document.createElement("ul");items.forEach(i=>u.append(i));return u};

/* sidebar */
function node(label,depth,on,tg,onTg,onGo){const d=document.createElement("div");d.className="node"+(on?" on":"");d.tabIndex=0;d.style.paddingLeft=(10+depth*14)+"px";
 d.innerHTML='<span class="tg">'+tg+'</span><span class="nm"></span>';d.querySelector(".nm").textContent=label;
 d.querySelector(".tg").onclick=e=>{e.stopPropagation();onTg&&onTg()};d.onclick=onGo;d.onkeydown=e=>e.key==="Enter"&&onGo();return d}
let eds=[],ed="all";
const vis=()=>ed==="all"?files:files.filter(f=>{const t=f.path.split("/")[0];return !/^ENG_SUB_/.test(t)||t===ed});
const edLabel=()=>$("ed").textContent="Edition: "+(ed==="all"?"All":ed.replace("ENG_SUB_",""));
$("ed").onclick=()=>{const o=eds.concat("all");ed=o[(o.indexOf(ed)+1)%o.length];localStorage.setItem("ed",ed);edLabel();play("subj");render()};
const sc=()=>cur.t==="s"?vis().filter(f=>f.s===cur.id):vis();
function dirsOf(list,p){const o={},pre=p?p+"/":"";list.forEach(f=>{if(!f.path.startsWith(pre))return;const r=f.path.slice(pre.length).split("/");if(r.length>1)o[r[0]]=(o[r[0]]||0)+1});return Object.keys(o).sort(NC.compare).map(n=>[pre+n,o[n]])}
const subOf=()=>cur.t==="s"?SUBJ.find(j=>j.id===cur.id):null;
function side(){const S=$("side");S.innerHTML="";
 const sub=subOf();S.insertAdjacentHTML("beforeend",'<div class="h"></div>');S.lastChild.textContent=sub?sub.name+" folders":"Folders";
 const list=sc(),key=(cur.t==="s"?"s"+cur.id:"d")+"|";
 const walk=(p,dp)=>dirsOf(list,p).forEach(([d])=>{const has=dirsOf(list,d).length,open=exp.has(key+d);
  S.append(node(base(d),dp,cur.p===d,has?(open?"&#9662;":"&#9656;"):"",()=>{open?exp.delete(key+d):exp.add(key+d);play("tick");side()},()=>{exp.add(key+d);go(cur.t,cur.id,d,"dir")}));if(open)walk(d,dp+1)});
 walk("",0)}

/* main */
function frow(x,sp){const li=document.createElement("li");li.tabIndex=0;li.innerHTML='<span>&#128196;</span><span class="n"></span><span class="m">'+size(x.size)+"</span>";
 const n=li.querySelector(".n");n.textContent=base(x.path);if(sp){const s=document.createElement("small");s.textContent=par(x.path);n.append(s)}
 const g=()=>openFile(x.path);li.onclick=g;li.onkeydown=e=>e.key==="Enter"&&g();return li}
function drow(d,n){const li=document.createElement("li");li.tabIndex=0;li.innerHTML='<span>&#128193;</span><span class="n"></span><span class="m">'+n+" files</span>";li.querySelector(".n").textContent=base(d);
 const g=()=>{exp.add((cur.t==="s"?"s"+cur.id:"d")+"|"+d);go(cur.t,cur.id,d,"dir")};li.onclick=g;li.onkeydown=e=>e.key==="Enter"&&g();return li}
function crumbs(){const c=document.createElement("div");c.className="crumbs";
 const add=(t,fn)=>{if(c.childNodes.length)c.append(" / ");if(fn){const a=document.createElement("a");a.textContent=t;a.onclick=fn;c.append(a)}else c.append(t)};
 add("Library",()=>go("d","","","back"));const sub=subOf(),parts=cur.p?cur.p.split("/"):[];
 if(sub)add(sub.name,parts.length?()=>go("s",cur.id,"","back"):null);
 parts.forEach((t,i)=>add(t,i<parts.length-1?()=>go(cur.t,cur.id,parts.slice(0,i+1).join("/"),"back"):null));return c}
const byName=(a,b)=>NC.compare(a.path,b.path);
function main(){const M=$("main");M.innerHTML="";M.scrollTop=0;const list=sc(),p=cur.p;M.append(crumbs());
 if(cur.t==="d"&&!p){const g=document.createElement("div");g.className="subs";SUBJ.forEach(s=>{const b=document.createElement("button");b.className="sub";
   b.innerHTML='<span class="p">'+s.p+"</span><h2>"+s.name+'</h2><span class="mono">'+vis().filter(f=>f.s===s.id).length+" PDFs</span>";b.onclick=()=>go("s",s.id,"","subj");g.append(b)});M.append(g);
  const rc=JSON.parse(localStorage.getItem("recent")||"[]");if(rc.length){M.insertAdjacentHTML("beforeend",'<div class="h" style="padding-left:0">Continue reading</div>');M.append(ul(rc.map(x=>frow({path:x},1))))}
  M.insertAdjacentHTML("beforeend",'<div class="h" style="padding-left:0">All folders</div>')}
 const kids=dirsOf(list,p).map(([d,n])=>drow(d,n)),fl=list.filter(f=>par(f.path)===p).sort(byName).map(f=>frow(f));
 M.append(kids.length+fl.length?ul(kids.concat(fl)):msg("No files here yet."))}

/* nav: hash is d:path  or  s:subjectId|path */
function render(){const h=decodeURIComponent(location.hash.slice(1)),i=h.indexOf(":");let t="d",id="",p="";
 if(i>0){t=h.slice(0,i)==="s"?"s":"d";const r=h.slice(i+1);if(t==="s"){const j=r.indexOf("|");id=j<0?r:r.slice(0,j);p=j<0?"":r.slice(j+1)}else p=r}
 cur={t,id,p};const key=(t==="s"?"s"+id:"d")+"|",a=p?p.split("/"):[];for(let k=1;k<a.length;k++)exp.add(key+a.slice(0,k).join("/"));
 $("q").value="";$("side").classList.remove("open");side();main()}
function go(t,id,p,s){play(s);const nh=t==="s"?"s:"+id+"|"+p:"d:"+p;if(location.hash.slice(1)===enc(nh)||(!location.hash&&t==="d"&&!p))render();else location.hash=enc(nh)}
addEventListener("hashchange",()=>{closeV();render()});
$("fbtn").onclick=()=>{play("tick");$("side").classList.toggle("open")};

function openFile(p){play("file");let rc=JSON.parse(localStorage.getItem("recent")||"[]").filter(x=>x!==p);rc.unshift(p);localStorage.setItem("recent",JSON.stringify(rc.slice(0,5)));
 const u=RAW+enc(p);$("vt").textContent=base(p);$("vo").href=u;$("vf").src=u;$("viewer").classList.add("on");pgOpen(p)}
function closeV(){$("viewer").classList.remove("on");$("vf").src="about:blank"}

/* ===== practice playground: Accounting inside Practice Set only ===== */
const D=[];
// A(name, aliases, group, left, right, note, sideLabels) ; "~" = no To/By ; right "" = single-column statement
function ADD(n,al,g,l,r,note,lab){D.push({n,al,g,l:l.split("|"),r:r?r.split("|"):null,note,lab:lab||"Debit (Dr.)|Credit (Cr.)"})}
const BS="Liabilities|Assets",RP="Receipts (Dr.)|Payments (Cr.)";
ADD("Ledger Account","ledger,t account,general ledger","Ch 2 - Accounting Process","Balance b/d (opening, if debit)|Debit entries (To ...)|Balance c/d (if credit balance)","Balance b/d (opening, if credit)|Credit entries (By ...)|Balance c/d (if debit balance)","Columns on each side: Date, Particulars, J.F., Amount. 'To' on debit side, 'By' on credit side. Nominal accounts are not balanced; they go to P&L. Keywords: principal books of account, posting, balance c/d, balance b/d.");
ADD("Cash Book","double column cash book,cash","Ch 2 - Accounting Process","Balance b/d (Cash | Bank)|Capital, Sales, Receipts from debtors|Discount Allowed (discount column)|Cash deposited into bank (C - contra)","Payments to creditors, expenses|Discount Received (discount column)|Cash withdrawn from bank (C - contra)|Balance c/d (Cash | Bank)","Three columns per side: Discount, Cash, Bank. Contra entry is marked 'C'. Keywords: contra entry, discount column, book of original entry.");
ADD("Trial Balance","tb","Ch 2 - Accounting Process","~Assets (Building, Plant, Inventory, Debtors, Cash, Bank)|~Expenses and Losses|~Drawings","~Capital|~Liabilities (Creditors, Loans, Bills Payable)|~Incomes and Gains (Sales, Discount Received)","Total of Debit balances = Total of Credit balances. It is a statement, not an account. Keywords: arithmetical accuracy, suspense account.","Dr. Balances|Cr. Balances");

const norm=s=>s.toLowerCase().replace(/[^a-z0-9& ]/g," ").replace(/\s+/g," ").trim();
function find(s){s=norm(s);if(!s)return[];
 const sc=D.map(d=>{const names=[d.n,...d.al.split(",")].map(norm);let b=0;
  for(const x of names){if(x===s)b=Math.max(b,100);else if(x.startsWith(s))b=Math.max(b,70);else if(x.includes(s))b=Math.max(b,50);
   else{const w=s.split(" ");if(w.every(t=>x.includes(t)))b=Math.max(b,40)}}
  return[d,b]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return sc.map(x=>x[0])}

const CL={e:"",acc:null,op:null,eq:false,mem:0,gt:0,steps:[],sel:-1,tape:false,err:false,sep:false,prev:"",lastOp:null,lastB:null};

 if(CL.sep&&t!=="E"){const m=t.match(/^(-?)(\d+)(.*)$/);if(m)t=m[1]+m[2].replace(/\B(?=(\d{3})+(?!\d))/g,",")+m[3]}
 $("lcd").textContent=t;$("ind").textContent=[CL.mem?"M":"",CL.gt?"GT":"",CL.sel>=0?"STEP "+(CL.sel+1):"",CL.op?SY[CL.op]:""].filter(Boolean).join("  ");ctape()}

function digit(k){fresh();
 if(k==="."){if(CL.e.includes("."))return;CL.e=(CL.e===""||CL.e==="-")?CL.e+"0.":CL.e+".";return}
 if(CL.e.replace(/[-.]/g,"").length+(k==="00"?2:1)>12)return;
 if(/^-?0$/.test(CL.e))CL.e=CL.e.slice(0,-1);if((CL.e===""||CL.e==="-")&&k==="00")k="0";CL.e+=k}
function oper(o){if(CL.e!==""){const v=parseFloat(CL.e);
  if(CL.op!==null&&CL.acc!==null){cpush({op:CL.op,v});setAcc(ap(CL.acc,CL.op,v))}else{if(CL.eq)CL.steps=[];cpush({op:"",v});CL.acc=v}}
 else if(CL.acc===null)CL.acc=0;CL.op=o;CL.e="";CL.eq=false}
function equals(gt){
 if(CL.e!==""){const v=parseFloat(CL.e);if(CL.op!==null&&CL.acc!==null){cpush({op:CL.op,v});CL.lastOp=CL.op;CL.lastB=v;setAcc(ap(CL.acc,CL.op,v))}else{cpush({op:"",v});CL.acc=v;CL.lastOp=null}}
 else if(CL.op!==null&&CL.acc!==null){CL.lastOp=CL.op;CL.lastB=CL.acc;setAcc(ap(CL.acc,CL.op,CL.acc))}
 else if(CL.eq&&CL.lastOp){setAcc(ap(CL.acc,CL.lastOp,CL.lastB))}
 else if(CL.acc===null)CL.acc=0;
 CL.op=null;CL.e="";CL.eq=true;if(gt&&!CL.err)CL.gt+=CL.acc}
function press(k){const P=CL.prev;CL.prev=k;if(CL.err&&k!=="AC"&&k!=="C")return;
 if(/^(\d|00|\.)$/.test(k))digit(k);else if("+-*/".includes(k))oper(k);else switch(k){
 case"=":equals(true);break;
 case"AC":Object.assign(CL,{e:"",acc:null,op:null,eq:false,steps:[],sel:-1,tape:false,err:false,lastOp:null,lastB:null});break;
 case"C":CL.e="";CL.err=false;if(CL.acc===null)CL.op=null;break;
 case"BS":if(CL.e!=="")CL.e=CL.e.slice(0,-1);if(CL.e==="-")CL.e="";break;
 case"SIGN":if(CL.e!=="")CL.e=CL.e[0]==="-"?CL.e.slice(1):"-"+CL.e;else if(CL.acc!==null)CL.acc=-CL.acc;break;
 case"SQRT":{const v=CL.e!==""?parseFloat(CL.e):(CL.acc===null?0:CL.acc);if(v<0)CL.err=true;else{fresh();CL.e=fmtN(Math.sqrt(v))}break}
 case"PCT":if(CL.e!==""&&CL.op!==null&&CL.acc!==null){const b=parseFloat(CL.e);cpush({op:CL.op,v:b,pct:true});setAcc(ap(CL.acc,CL.op,b,true));CL.op=null;CL.e="";CL.eq=true;CL.lastOp=null;if(!CL.err)CL.gt+=CL.acc}
  else if(CL.e!=="")CL.e=fmtN(parseFloat(CL.e)/100);break;
 case"MU":if(CL.e!==""&&CL.acc!==null&&(CL.op==="*"||CL.op==="/")){const b=parseFloat(CL.e);setAcc(CL.op==="*"?CL.acc*(1+b/100):CL.acc/(1-b/100));CL.op=null;CL.e="";CL.eq=true;CL.lastOp=null}break;
 case"M+":case"M-":equals(false);if(!CL.err)CL.mem+=(k==="M+"?1:-1)*CL.acc;break;
 case"MRC":if(P==="MRC")CL.mem=0;else{fresh();CL.e=fmtN(CL.mem)}break;
 case"GT":if(P==="GT")CL.gt=0;else{fresh();CL.e=fmtN(CL.gt)}break;
 case"DISP":CL.sep=!CL.sep;break;
 case"REV":CL.tape=!CL.tape;CL.sel=CL.tape&&CL.steps.length?CL.steps.length-1:-1;break;
 case"UP":case"DN":if(!CL.steps.length)break;if(!CL.tape){CL.tape=true;CL.sel=CL.steps.length-1}else CL.sel=Math.max(0,Math.min(CL.steps.length-1,(CL.sel<0?CL.steps.length:CL.sel)+(k==="UP"?-1:1)));break;
 case"CORR":if(CL.sel>=0&&CL.e!==""){CL.steps[CL.sel].v=parseFloat(CL.e);setAcc(runSteps(CL.steps));CL.op=null;CL.e="";CL.eq=true}else CL.e="";break}
 cshow()}
