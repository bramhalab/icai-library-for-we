<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice Playground</title>
<style>
:root{color-scheme:light;--paper:#F3EEE2;--dark:#E8E0CC;--ink:#1E2A38;--soft:#4A5568;--ledger:#8C6B3F;--acc:#1E4D6B;--rule:#C9BEA0;--card:#FBF8F0}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}body{margin:0;padding:10px 10px 90px;background:var(--paper);color:var(--ink);font:16px/1.45 Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;flex:none}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;position:sticky;top:0;background:var(--paper);padding:4px 0;z-index:5}
.tabs{display:flex;gap:6px}.tabs button{width:44px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--rule);border-radius:6px}
.tabs button.on{border-color:var(--acc);background:var(--acc);color:var(--paper)}
#subj button{width:34px;height:32px;border-radius:50%}
.tp{min-width:0}
#notes{display:block;width:100%;min-height:50vh;font:16px/28px Georgia,serif;padding:0 10px;border:1px solid var(--rule);background:var(--card) linear-gradient(transparent 27px,var(--rule) 27px) 0 0/100% 28px local;resize:vertical}
#cmd,#fq{display:block;width:100%;padding:9px 12px;background:var(--card);border:1.5px solid var(--acc);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--ledger);background:var(--card);padding:3px 10px;font-size:13px;cursor:pointer;border-radius:14px}.chip.on{background:var(--acc);color:var(--paper);border-color:var(--acc)}
.acard{min-width:0;margin:8px 0;border:1px solid var(--rule);background:var(--card);overflow:hidden}.acard.dragging{opacity:.5}
.ah{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;min-height:46px}
.ah b{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px;color:var(--acc)}
.gp{background:transparent;border:0;color:var(--soft);padding:4px;cursor:grab;touch-action:none;display:flex}.gp .ic{width:18px;height:18px}
.ex{display:flex;transition:transform .15s;color:var(--ledger)}.acard.open .ex{transform:rotate(90deg)}
.sum{font:12px 'Courier New',monospace;color:var(--soft);white-space:nowrap}
.rm{width:34px;height:34px;font-size:20px;line-height:1;flex:none;background:transparent;border:0;color:var(--soft)}
.cbody{display:none;padding:0 10px 10px}.acard.open .cbody{display:block}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1.5px solid var(--ink)}.two.one{grid-template-columns:minmax(0,1fr)}
.side{min-width:0;padding:6px}.side+.side{border-left:1.5px solid var(--ink)}
.sh{font:700 12px 'Courier New',monospace;color:var(--ledger);border-bottom:2px solid var(--ledger);padding-bottom:3px;margin-bottom:6px}
.rows{min-height:36px}
.r{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(64px,34%) 26px;gap:3px;align-items:center;margin-bottom:4px;background:var(--card)}
.r.drag{opacity:.55;outline:2px dashed var(--acc)}
.r input{width:100%;min-width:0;font-size:15px;padding:7px 6px;background:var(--paper);border:1px solid var(--rule)}.r .am{text-align:right;font-family:'Courier New',monospace}
.r .gp{padding:2px;justify-content:center}.rx{width:26px;height:30px;padding:0;font-size:18px;color:var(--soft);background:transparent;border:0}
.add,.acts button{min-height:34px;background:transparent;border:1px dashed var(--ledger);color:var(--ledger);font:12px 'Courier New',monospace;padding:3px 10px;margin:4px 0;display:inline-flex;align-items:center;gap:6px}
.tot{display:flex;justify-content:space-between;margin-top:6px;font-weight:700;font-family:'Courier New',monospace}.tot::before{content:"Total";font-weight:400;color:var(--soft);font-family:Georgia,serif}
.chk{margin-top:6px;font:12px 'Courier New',monospace;color:var(--soft)}.chk.ok{color:#2F6B4F;font-weight:700}
.acard details{margin-top:6px;font-size:13px;color:var(--soft)}
@media(max-width:620px){.two{grid-template-columns:minmax(0,1fr)}.side+.side{border-left:0;border-top:1.5px solid var(--ink)}}
@media(pointer:coarse){input,textarea{font-size:16px!important}.r input{padding:9px 6px}}
.fcard{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);padding:8px 10px;margin:6px 0}
.fcard>div{flex:1;min-width:0}.fn{font:700 13px Georgia;color:var(--acc)}.fcard pre{margin:2px 0 0;white-space:pre-wrap;word-break:break-word;font:14px/1.4 'Courier New',monospace}
.fcard button{width:34px;height:34px;flex:none;background:transparent;border:1.5px solid var(--rule);border-radius:6px;display:inline-flex;align-items:center;justify-content:center}.fcard button.ok{border-color:#2F6B4F;color:#2F6B4F}
.fld{margin:0 0 12px}.fld label{display:block;font:700 12px 'Courier New',monospace;color:var(--ledger);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.fld textarea{display:block;width:100%;min-height:76px;padding:8px 10px;background:var(--card);border:1px solid var(--rule);resize:vertical;font:15px/1.5 Georgia,serif}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#wc{font:12px 'Courier New',monospace;color:var(--soft);margin-right:auto}
.dtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.dtools button{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--rule);border-radius:6px}
.dtools button.on{border-color:var(--acc);background:var(--acc);color:var(--paper)}.dtools .sp{flex:1}
.dtools .dc{width:24px;height:24px;border-radius:50%}.dtools .dc.on{border:3px solid var(--ink)}
#dw{position:relative}#dcv{display:block;width:100%;aspect-ratio:4/3;background:var(--card);border:1px solid var(--rule);touch-action:none}#dti{position:absolute;margin:0;padding:0 8px;background:transparent;border:1.5px dashed var(--acc);outline:none;text-align:center;transform-origin:center;border-radius:3px;z-index:3}.dtools{row-gap:6px}#slm{max-height:42vh;overflow:auto;margin:0 0 6px;border:1.5px solid var(--acc);background:var(--card)}#slm div{padding:7px 10px;border-top:1px solid var(--rule);cursor:pointer;display:flex;gap:8px;align-items:baseline}#slm div:first-child{border-top:0}#slm div.on,#slm div:hover{background:var(--dark)}#slm b{font-size:14px}#slm small{font:11px "Courier New",monospace;color:var(--ledger);margin-left:auto;white-space:nowrap}#slm .sh2{cursor:default;font:700 11px "Courier New",monospace;color:var(--soft);background:var(--paper)}#subl{font:700 12px "Courier New",monospace;color:var(--ledger);align-self:center;padding:0 4px}
.calc{width:min(100%,340px);margin:6px auto;background:#25232a;border-radius:12px;padding:14px;color:#fff;font-family:system-ui,sans-serif;box-shadow:0 4px 0 #111}
.cb{font-weight:700;font-size:13px;display:flex;justify-content:space-between;color:#ccc;margin-bottom:6px}
.lcdw{background:#cfd8d4;color:#111;border-radius:4px;padding:6px 10px;box-shadow:inset 0 2px 5px #0006;height:74px;position:relative;overflow:hidden}
#ind{font:700 11px 'Courier New',monospace;min-height:14px}#lcd{font:34px 'Courier New',monospace;text-align:right;position:absolute;right:10px;bottom:4px;white-space:nowrap}
#tape{background:#cfd8d4;color:#111;font:12px 'Courier New',monospace;max-height:90px;overflow:auto;margin-top:6px;padding:4px 8px;border-radius:4px}#tape .on{background:#111;color:#cfd8d4}
.kg{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.kg button{height:40px;border:0;border-radius:6px;background:#3d3d43;color:#eee;font:17px system-ui,sans-serif;box-shadow:0 3px 0 #111;padding:0}
.kg button:active{transform:translateY(2px);box-shadow:none}
.kg .sm{font-size:9px;line-height:1.1}.kg .pu{background:#7a1f6e}.kg .p{grid-row:span 2;height:auto}.kg .lt{background:#e5e5e5;color:#222}
.kg i{display:block}.cap{grid-column:5/7;text-align:center;font:9px system-ui;color:#ccc;align-self:end}
</style></head><body><div id="pg"></div>
<script>
const $=id=>document.getElementById(id);
const qp=new URLSearchParams(location.search);let qsub=qp.get("s")||"";
let ac;const play=()=>{if(localStorage.getItem("mute")==="1")return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
 const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type="square";o.frequency.value=1800;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.04)}catch(e){}};
const D=[];
// A(name, aliases, group, left, right, note, sideLabels) ; "~" = no To/By ; right "" = single-column statement
function ADD(n,al,g,l,r,note,lab){D.push({n,al,g,l:l.split("|"),r:r?r.split("|"):null,note,lab:lab||"Debit (Dr.)|Credit (Cr.)"})}
const BS="Liabilities|Assets",RP="Receipts (Dr.)|Payments (Cr.)";
ADD("Ledger Account","ledger,t account,general ledger","Ch 2 - Accounting Process","Balance b/d (opening, if debit)|Debit entries (To ...)|Balance c/d (if credit balance)","Balance b/d (opening, if credit)|Credit entries (By ...)|Balance c/d (if debit balance)","Columns on each side: Date, Particulars, J.F., Amount. 'To' on debit side, 'By' on credit side. Nominal accounts are not balanced; they go to P&L. Keywords: principal books of account, posting, balance c/d, balance b/d.");
ADD("Cash Book","double column cash book,cash","Ch 2 - Accounting Process","Balance b/d (Cash | Bank)|Capital, Sales, Receipts from debtors|Discount Allowed (discount column)|Cash deposited into bank (C - contra)","Payments to creditors, expenses|Discount Received (discount column)|Cash withdrawn from bank (C - contra)|Balance c/d (Cash | Bank)","Three columns per side: Discount, Cash, Bank. Contra entry is marked 'C'. Keywords: contra entry, discount column, book of original entry.");
ADD("Trial Balance","tb","Ch 2 - Accounting Process","~Assets (Building, Plant, Inventory, Debtors, Cash, Bank)|~Expenses and Losses|~Drawings","~Capital|~Liabilities (Creditors, Loans, Bills Payable)|~Incomes and Gains (Sales, Discount Received)","Total of Debit balances = Total of Credit balances. It is a statement, not an account. Keywords: arithmetical accuracy, suspense account.","Dr. Balances|Cr. Balances");
ADD("Bank Reconciliation Statement","brs,bank reconciliation","Ch 3 - BRS","~Balance as per Cash Book (Dr. / favourable)|~Add: Cheques issued but not yet presented for payment|~Add: Direct credits by bank not in Cash Book (interest, dividend)|~Less: Cheques deposited but not yet collected|~Less: Direct debits by bank (bank charges)|~Balance as per Pass Book (Cr.)","","Format starts from favourable Cash Book balance. Signs reverse if you start from the bank overdraft balance or Pass Book. Keywords: Pass Book, cheques issued but not presented, cheques deposited but not collected.");
ADD("Machinery Account","asset account,plant account,fixed asset","Ch 5 - Depreciation","Balance b/d|Bank A/c (cost of machine)|Bank A/c (installation expenses)","Depreciation A/c (if credited to asset)|Asset Disposal A/c (on sale)|Balance c/d","Cost = purchase price + installation + all costs to bring asset to working condition. Straight Line: (Cost - Scrap value) / Useful life. WDV rate (%) = [1 - (Residual value / Cost)^(1/n)] x 100, where n = useful life. Keywords: historical cost, depreciable amount, useful life.");
ADD("Depreciation Account","depreciation","Ch 5 - Depreciation","Machinery A/c (or Provision for Depreciation A/c)","Profit and Loss A/c","Depreciation A/c is a nominal account; it is closed by transfer to P&L. Keywords: straight line method, written down value method, depreciation for the period of use.");
ADD("Provision for Depreciation Account","accumulated depreciation","Ch 5 - Depreciation","Asset Disposal A/c (on sale of asset)|Balance c/d","Balance b/d|Depreciation A/c","Used when the asset is shown at historical cost and depreciation accumulates separately. Keywords: accumulated depreciation, historical cost.");
ADD("Asset Disposal Account","disposal,sale of asset","Ch 5 - Depreciation","Asset A/c (cost)|Profit on sale (to P&L) - balancing figure","Provision for Depreciation A/c|Bank A/c (sale proceeds)|Loss on sale (to P&L) - balancing figure","Profit or loss on disposal = Sale proceeds - Book value. Keywords: book value, profit/loss on disposal.");
ADD("Bills Receivable Account","bills receivable,br,bill receivable","Ch 6 - Bills of Exchange","Balance b/d|Debtors A/c (bills received)","Bank A/c (collected on maturity)|Debtors A/c (dishonoured)|Creditor A/c (endorsed)|Balance c/d","Bills Receivable is an asset (personal / real). Keywords: drawer, drawee, maturity, dishonour, endorsement, discounting.");
ADD("Bills Payable Account","bills payable,bp,bill payable","Ch 6 - Bills of Exchange","Bank A/c (paid on maturity)|Balance c/d","Balance b/d|Creditors A/c (bills accepted)","Bills Payable is a liability. Keywords: acceptance, maturity, noting charges, renewal.");
ADD("Manufacturing Account","manufacturing,factory","Ch 7 - Final Accounts","Opening Work-in-Process|Raw Material Consumed (Opening inventory + Purchases - Closing inventory)|Direct Wages|Direct Expenses (royalty, hire charges per unit) = PRIME COST|Factory Overheads / Indirect Expenses (repairs, depreciation) = FACTORY COST","By-products at net realisable value|Closing Work-in-Process|Trading A/c - Cost of production (balancing figure)","Raw Material Consumed = Opening inventory + Purchases - Closing inventory. Prime cost = RM consumed + direct wages + direct expenses. Keywords: prime cost, factory cost, cost of production, work-in-process, by-product, overheads.");
ADD("Trading Account","trading,gross profit","Ch 7 - Final Accounts","Opening Inventory|Purchases (less Returns)|Carriage Inwards, Wages, Direct expenses|Gross Profit c/d (balancing figure)","Sales (less Returns)|Closing Inventory|Gross Loss c/d (if any)","Gross Profit = Net Sales - Cost of Goods Sold. Keywords: cost of goods sold, gross profit, direct expenses, closing inventory.");
ADD("Profit and Loss Account","p&l,pl,profit and loss,profit & loss","Ch 7 - Final Accounts","Gross Loss b/d (if any)|Salaries, Rent, Insurance, Discount Allowed|Selling and distribution expenses|Bad debts + Provision for doubtful debts|Depreciation|Interest on loan|Net Profit (transferred to Capital A/c)","Gross Profit b/d|Discount Received|Commission, Interest, Rent received|Net Loss (transferred to Capital A/c)","Indirect expenses and incomes are shown here. Keywords: net profit, indirect expenses, operating expenses, other income.");
ADD("Balance Sheet","bs,balance sheet,sole proprietor balance sheet","Ch 7 - Final Accounts","~Capital (+ Net Profit - Drawings)|~Long-term loans|~Trade payables, Bills Payable|~Outstanding expenses|~Income received in advance","~Fixed Assets (Land and Building, Plant, Furniture)|~Investments|~Closing Inventory|~Trade receivables (less Provision), Bills Receivable|~Cash and Bank|~Prepaid expenses, Accrued income","Total Liabilities = Total Assets. Keywords: financial position, fixed assets, current assets, current liabilities, capital.",BS);
ADD("Receipts and Payments Account","receipts and payments,r&p,rp","Ch 8 - NPO","~Opening balance: Cash in hand, Cash at bank|~Subscriptions|~Donations|~Entrance fees|~Sale of fixed assets|~Interest and other receipts","~Salaries and wages|~General expenses, Rent|~Purchase of fixed assets, Investments|~Closing balance: Cash in hand, Cash at bank","Summary of the Cash Book without date column; includes all receipts and payments, capital or revenue, of any period. Shows no surplus or deficit. Keywords: summary of cash book, not based on accrual, opening and closing balances.",RP);
ADD("Income and Expenditure Account","income and expenditure,i&e,ie","Ch 8 - NPO","Salaries, Rent, General expenses (current year)|Outstanding expenses (adjusted)|Depreciation|Surplus (excess of income over expenditure) - transferred to Capital Fund","Subscriptions (current year, accrual basis)|Donations (ordinary / revenue)|Interest accrued|Entrance fees (if treated as revenue)|Deficit (excess of expenditure over income)","Equivalent to the Profit and Loss Account of a profit-making entity. Capital receipts and capital expenditure are excluded. Surplus / Deficit goes to Capital Fund. Keywords: surplus, deficit, accrual principle, capital fund, fund accounting.","Expenditure (Dr.)|Income (Cr.)");
ADD("Statement of Affairs","soa,single entry balance sheet","Ch 9 - Incomplete Records","Capital (balancing figure)|Loans, Bank overdraft|Sundry creditors|Bills payable|Outstanding expenses","Building|Machinery|Furniture|Inventory|Sundry debtors|Bills receivable|Loans and advances|Cash and bank|Prepaid expenses","Capital = Assets - Liabilities. Similar to a Balance Sheet but prepared from partly recorded transactions. Keywords: single entry system, net worth, incomplete records.",BS);
ADD("Computation of Profit by Capital Comparison","net worth method,capital comparison,profit by capital","Ch 9 - Incomplete Records","~Capital at the end (a)|~Add: Drawings|~Less: Fresh capital introduced|~Less: Capital at the beginning (b)|~Profit = (a) - (b)","","Profit = Closing capital + Drawings - Fresh capital - Opening capital. Keywords: Net Worth method, Statement of Affairs method.");
ADD("Total Debtors Account","debtors control,total debtors,sales ledger adjustment","Ch 9 - Incomplete Records","Balance b/d|Credit Sales (balancing figure if unknown)|Bills Receivable dishonoured|Cash/Bank refunded to customers","Cash/Bank received|Discount Allowed|Sales Returns|Bad debts|Bills Receivable received|Balance c/d","Used to find credit sales when it is not given. Keywords: credit sales, balancing figure, sales ledger.");
ADD("Total Creditors Account","creditors control,total creditors,purchase ledger adjustment","Ch 9 - Incomplete Records","Cash/Bank paid|Discount Received|Purchase Returns|Bills Payable accepted|Balance c/d","Balance b/d|Credit Purchases (balancing figure if unknown)","Used to find credit purchases when it is not given. Keywords: credit purchases, purchase ledger.");
ADD("Profit and Loss Appropriation Account","appropriation","Ch 10 - Partnership","Interest on Capital|Partners' Salary / Commission|Transfer to Reserve|Profit transferred to Partners' Capital/Current A/c (in profit sharing ratio)","Net Profit b/d (from P&L A/c)|Interest on Drawings","Interest on capital, salary and commission are shown here, not in P&L A/c. Drawings do not appear here. Keywords: profit sharing ratio, interest on capital, interest on drawings, partnership deed.");
ADD("Partner's Capital Account Fixed","fixed capital,capital account fixed","Ch 10 - Partnership","Balance c/d|Withdrawal of capital","Balance b/d|Bank A/c (additional capital)","Under Fixed Capital Method, capital balance stays fixed; all adjustments go to the Current Account. Keywords: fixed capital method.");
ADD("Partner's Current Account","current account","Ch 10 - Partnership","Drawings|Interest on Drawings|Share of loss|Balance c/d (if debit)","Balance b/d|Interest on Capital|Salary / Commission|Share of profit","Capital A/c (fluctuating) = Capital A/c + Current A/c (fixed). Keywords: current account, fixed capital method.");
ADD("Partner's Capital Account Fluctuating","fluctuating capital","Ch 10 - Partnership","Drawings|Interest on Drawings|Share of loss|Balance c/d","Balance b/d|Bank A/c (additional capital)|Interest on Capital|Salary / Commission|Share of profit","All adjustments are made in a single Capital Account; balance changes every year. Keywords: fluctuating capital method.");
ADD("Revaluation Account","revaluation","Ch 10 - Partnership","Decrease in value of assets (Inventory, Furniture)|Increase in liabilities, Provision for doubtful debts|Outstanding expenses|Profit on Revaluation - to old partners' Capital A/c (old ratio)","Increase in value of assets (Building)|Decrease in liabilities|Loss on Revaluation - to old partners' Capital A/c (old ratio)","Prepared on admission, retirement, death. Profit/loss is shared by old partners in the old profit sharing ratio. Keywords: revaluation of assets and liabilities, old ratio.");
ADD("Memorandum Revaluation Account","memorandum revaluation","Ch 10 - Partnership","Part 1: Decrease in assets / Provision for bad debts|Profit on Revaluation - old partners (old ratio)|Part 2 (reversal): Assets restored to old book value","Part 1: Increase in assets|Part 2 (reversal): Loss on Revaluation - all partners (new ratio)|Part 2: Reverse of Part 1 items","Used when the book values of assets and liabilities are to remain unchanged after admission. Keywords: memorandum revaluation, book values unchanged.");
ADD("Partners Capital Accounts on Admission","admission capital accounts,capital accounts admission","Ch 10 - Partnership","Goodwill (old partners' capital to new partner's capital)|Loss on Revaluation|Drawings|Balance c/d","Balance b/d|Bank A/c (new partner's capital)|Goodwill (sacrificing partners)|General Reserve / P&L balance|Profit on Revaluation","Columns: A, B, C. Goodwill brought by the new partner is credited to old partners in the sacrificing ratio. Sacrifice = Old share - New share. Keywords: sacrificing ratio, goodwill, new profit sharing ratio, admission.");
ADD("Realisation Account","realisation,dissolution","Ch 10 - Partnership","Sundry assets (except cash/bank) at book value|Bank A/c (liabilities paid)|Realisation expenses|Partner's Capital A/c (assets/liabilities taken over, if applicable)|Profit on Realisation - to partners' Capital A/c","Liabilities at book value|Bank A/c (assets realised)|Partner's Capital A/c (assets taken over)|Loss on Realisation - to partners' Capital A/c","Opened on dissolution of the firm. Keywords: dissolution, realisation of assets, settlement of liabilities.");
ADD("Equity Share Capital Account","share capital,equity share capital","Ch 11 - Company Accounts","Forfeited Shares A/c (amount called up)|Calls in Arrears|Balance c/d","Share Application A/c|Share Allotment A/c|Share First Call / Final Call A/c","Authorised = Issued + Unissued. Called-up = Paid-up + Calls in arrears - Calls in advance. Keywords: authorised, issued, subscribed, called-up, paid-up capital.");
ADD("Share Application Account","application,application and allotment","Ch 11 - Company Accounts","Bank A/c (refund of excess application money)|Share Capital A/c (application money on allotted shares)|Share Allotment A/c (excess adjusted)","Bank A/c (application money received on all shares applied)","Application money must be at least 5% of nominal value (Section 39), SEBI min. 25% of issue price. Keywords: oversubscription, pro-rata allotment, minimum subscription.");
ADD("Share Allotment Account","allotment","Ch 11 - Company Accounts","Share Capital A/c (allotment money due)|Securities Premium A/c (if any)","Share Application A/c (excess adjusted)|Bank A/c (received)|Calls in Arrears A/c","Allotment money = Amount due on allotment. Keywords: securities premium, calls in arrears, allotment money.");
ADD("Forfeited Shares Account","share forfeiture,forfeiture,forfeited shares","Ch 11 - Company Accounts","Share Capital A/c (discount allowed on reissue)|Capital Reserve A/c (gain on reissue)","Share Capital A/c (amount received on forfeited shares)","Forfeiture: shareholder fails to pay calls. Gain on reissue is transferred to Capital Reserve. Keywords: forfeiture, reissue, capital reserve, calls in arrear.");
ADD("Debentures Account","debentures,10% debentures","Ch 11 - Company Accounts","Debenture holders / Bank (redemption)|Balance c/d","Balance b/d|Debenture Application and Allotment A/c","Debenture is a loan (long-term borrowing). Keywords: debenture holders, discount on issue, redemption, DRR.");
ADD("Debenture Interest Account","debenture interest","Ch 11 - Company Accounts","Bank A/c (interest paid)|TDS Payable A/c|Outstanding Interest c/d","Profit and Loss A/c (finance cost)","Interest is a charge against profits, paid whether or not profit is made. Keywords: finance cost, TDS, interest payable.");
ADD("Capital Redemption Reserve Account","crr,capital redemption reserve","Ch 11 - Company Accounts","Bonus issue (Equity Share Capital)|Balance c/d","Balance b/d|Profit and Loss A/c (transfer)|General Reserve (transfer)","Created on redemption of preference shares out of profits. Can be used only for issuing fully paid bonus shares. Keywords: redemption of preference shares, CRR, bonus issue.");

const norm=s=>s.toLowerCase().replace(/[^a-z0-9& ]/g," ").replace(/\s+/g," ").trim();
function find(s){s=norm(s);if(!s)return[];
 const sc=D.map(d=>{const names=[d.n,...d.al.split(",")].map(norm);let b=0;
  for(const x of names){if(x===s)b=Math.max(b,100);else if(x.startsWith(s))b=Math.max(b,70);else if(x.includes(s))b=Math.max(b,50);
   else{const w=s.split(" ");if(w.every(t=>x.includes(t)))b=Math.max(b,40)}}
  return[d,b]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return sc.map(x=>x[0])}


const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

["Contract Act","Consideration","Sec 2(d): past, present or future. Stranger to consideration can sue (Chinnaya v. Ramayya), but a stranger to a contract generally cannot sue (privity of contract). Sec 25: agreement without consideration is void, except 25(1) natural love and affection (written, registered), 25(2) past voluntary service, 25(3) time-barred debt."],
["Contract Act","Capacity - minor","Sec 11: minor's agreement is void ab initio. Case: Mohori Bibee v Dharmodas Ghose. No estoppel, no ratification; minor may be beneficiary; necessaries (Sec 68) - estate liable, not the minor personally."],
["Contract Act","Free consent","Sec 14: coercion (Sec 15), undue influence (Sec 16), fraud (Sec 17), misrepresentation (Sec 18), mistake (Sec 20-22). Contract voidable at option of aggrieved party (Sec 19, 19A) except mistake - void."],
["Contract Act","Lawful object","Sec 23: unlawful if forbidden by law, defeats law, fraudulent, injures person/property, immoral or opposed to public policy - agreement is void."],
["Contract Act","Void agreements","Sec 24-30: restraint of marriage (26), restraint of trade (27), restraint of legal proceedings (28), uncertainty (29), wagering (30)."],
["Contract Act","Discharge of contract","Performance (Sec 37-67), agreement or novation (Sec 62), impossibility (Sec 56), breach, lapse of time. Case: Taylor v Caldwell (supervening impossibility)."],

 const tpl=k=>{D0.tpl=k;save();mk($("dtp"),TP,()=>D0.tpl,tpl);draw()};mk($("dtp"),TP,()=>D0.tpl,tpl);
 Object.keys(DCOL).forEach(k=>{const b=document.createElement("button");b.className="dc"+(k===pen?" on":"");b.style.background=css(k);b.title=k;b.onclick=()=>{pen=k;document.querySelectorAll("#dcol .dc").forEach(x=>x.classList.toggle("on",x===b));if(sel&&D0.items.includes(sel)){snap();sel.c=k;save();draw()}};$("dcol").append(b)});
 /* inline text editing */
 function startEdit(it){finishEdit();editing=it;sel=it;const[W,H]=dim(),[w,h]=tbox(it,W);ti.hidden=false;ti.value=it.s;ti.style.font=Math.round(it.sz*W)+"px Georgia";ti.style.color=css(it.c);
  const fit=()=>{const c=cv.getContext("2d");c.font=ti.style.font;const ww=Math.max(60,c.measureText(ti.value||" ").width+24);ti.style.width=ww+"px";ti.style.left=(it.x*W-ww/2)+"px";ti.style.top=(it.y*H-h/2-4)+"px";ti.style.height=(h+8)+"px";ti.style.transform="rotate("+(it.rot||0)+"rad)"};
  ti._fit=fit;fit();draw();setTimeout(()=>{ti.focus();ti.select()},0)}
 function finishEdit(){if(!editing)return;const it=editing;editing=null;ti.hidden=true;if(!it.s.trim()){D0.items=pgS.dia.items=D0.items.filter(z=>z!==it);if(sel===it)sel=null}save();draw()}
 ti.oninput=()=>{if(editing){editing.s=ti.value;ti._fit();draw()}};
 ti.onkeydown=e=>{if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();finishEdit()}e.stopPropagation()};ti.onblur=()=>setTimeout(finishEdit,60);
 /* pointer */
 const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 const moveIt=(it,dx,dy,W,H)=>{const nx=dx/W,ny=dy/H;if(it.t==="t"){it.x+=nx;it.y+=ny}else if(it.t==="s")it.pts.forEach(p=>{p[0]+=nx;p[1]+=ny});else{it.a[0]+=nx;it.a[1]+=ny;it.b[0]+=nx;it.b[1]+=ny}};
 cv.onpointerdown=e=>{if(tool==="hand")return;e.preventDefault();const p=pt(e),[W,H]=dim();
  if(editing){finishEdit();return}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(tool==="pen"){cur={t:"s",c:pen,w:.005,pts:[[p[0]/W,p[1]/H]]};draw();return}
  if(["line","arrow","ell","rect"].includes(tool)){cur={t:{line:"l",arrow:"a",ell:"e",rect:"r"}[tool],c:pen,w:.005,a:[p[0]/W,p[1]/H],b:[p[0]/W,p[1]/H]};draw();return}
  if(sel&&D0.items.includes(sel)){const hs=handles(sel,W,H);
   if(near(p,hs.del,18)){snap();D0.items=pgS.dia.items=D0.items.filter(z=>z!==sel);sel=null;save();draw();return}
   if(sel.t==="t"&&near(p,hs.rot,18)){snap();drag={m:"rot"};return}
   if(sel.t==="t"&&near(p,hs.size,18)){snap();drag={m:"size",d0:Math.hypot(p[0]-sel.x*W,p[1]-sel.y*H),s0:sel.sz};return}
   if(hs.pa&&near(p,hs.pa,16)){snap();drag={m:"pa"};return}if(hs.pb&&near(p,hs.pb,16)){snap();drag={m:"pb"};return}}
  let hit=null;for(let i=D0.items.length-1;i>=0;i--)if(hitIt(D0.items[i],p,W,H)){hit=D0.items[i];break}
  if(hit){const now=Date.now(),again=lastTap.it===hit&&now-lastTap.t<400;lastTap={t:now,it:hit};sel=hit;if((again||tool==="txt")&&hit.t==="t"){startEdit(hit);return}snap();drag={m:"move",last:p,moved:false};draw();return}
  if(tool==="txt"){snap();const it={t:"t",c:pen,x:p[0]/W,y:p[1]/H,s:"",sz:.045,rot:0};D0.items.push(it);startEdit(it);return}
  sel=null;draw()};
 cv.onpointermove=e=>{const p=pt(e),[W,H]=dim();
  if(cur){if(cur.pts)cur.pts.push([p[0]/W,p[1]/H]);else cur.b=[p[0]/W,p[1]/H];draw();return}
  if(!drag||!sel)return;
  if(drag.m==="move"){const dx=p[0]-drag.last[0],dy=p[1]-drag.last[1];if(Math.abs(dx)+Math.abs(dy)>0){drag.moved=true;moveIt(sel,dx,dy,W,H);drag.last=p}}
  else if(drag.m==="rot"){sel.rot=Math.atan2(p[1]-sel.y*H,p[0]-sel.x*W)+Math.PI/2;if(e.shiftKey){const st=Math.PI/12,r=Math.round(sel.rot/st)*st;if(Math.abs(sel.rot-r)<.07)sel.rot=r}}
  else if(drag.m==="size"){const d=Math.hypot(p[0]-sel.x*W,p[1]-sel.y*H);sel.sz=Math.max(.02,Math.min(.2,drag.s0*d/Math.max(8,drag.d0)))}
  else if(drag.m==="pa")sel.a=[p[0]/W,p[1]/H];else if(drag.m==="pb")sel.b=[p[0]/W,p[1]/H];
  draw()};
 const up=()=>{if(cur){const it=cur;cur=null;const ok=it.pts?true:Math.hypot(it.b[0]-it.a[0],it.b[1]-it.a[1])>.01;if(ok){snap();D0.items.push(it);if(!it.pts){sel=it}save()}draw();return}
  if(drag){drag=null;save();draw()}};cv.onpointerup=up;cv.onpointercancel=up;
 if(!FILL.d._k){FILL.d._k=1;addEventListener("keydown",e=>{if($("td").hidden||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if((e.key==="Delete"||e.key==="Backspace")&&FILL.d._sel&&FILL.d._sel()){e.preventDefault()}})}
 FILL.d._sel=()=>{if(sel&&D0.items.includes(sel)){snap();D0.items=pgS.dia.items=D0.items.filter(z=>z!==sel);sel=null;save();draw();return true}return false};
 FILL.d._draw=draw;REF.d=()=>FILL.d();if(!FILL.d._r){FILL.d._r=1;addEventListener("resize",()=>{if(!$("td").hidden&&FILL.d._draw)FILL.d._draw()})}
 setTool(tool);setTimeout(draw,0)};

/* ---------- calculator ---------- */
/*CALC*/
const CL={e:"",acc:null,op:null,eq:false,mem:0,gt:0,steps:[],sel:-1,tape:false,err:false,sep:false,prev:"",lastOp:null,lastB:null};
const SY={"+":"+","-":"\u2212","*":"\u00d7","/":"\u00f7"};
const ap=(a,o,b,p)=>{if(p){if(o==="*")return a*b/100;if(o==="/")return a/b*100;if(o==="+")return a+a*b/100;return a-a*b/100}
 return o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:b===0?NaN:a/b};
const runSteps=st=>{let a=null;st.forEach(s=>{a=s.op&&a!==null?ap(a,s.op,s.v,s.pct):s.v});return a};
function fmtN(n){if(!isFinite(n)||Math.abs(n)>=1e12)return"E";n=parseFloat(n.toPrecision(12));let s=String(n);if(/e/i.test(s))s=n.toFixed(11).replace(/0+$/,"");return s}
const cpush=s=>{if(CL.steps.length<150)CL.steps.push(s)};
const setAcc=v=>{CL.acc=v;if(!isFinite(v))CL.err=true};
function fresh(){if(CL.eq&&CL.sel<0){CL.acc=null;CL.op=null;CL.steps=[];CL.eq=false}}
function cshow(){let t=CL.err?"E":CL.e!==""?CL.e:(CL.sel>=0&&CL.steps[CL.sel])?String(CL.steps[CL.sel].v):fmtN(CL.acc===null?0:CL.acc);if(t==="E")CL.err=true;
 if(CL.sep&&t!=="E"){const m=t.match(/^(-?)(\d+)(.*)$/);if(m)t=m[1]+m[2].replace(/(\d)(?=(\d\d)+\d$)/g,"$1,")+m[3]}
 $("lcd").textContent=t;$("ind").textContent=[CL.mem?"M":"",CL.gt?"GT":"",CL.sel>=0?"STEP "+(CL.sel+1):"",CL.op?SY[CL.op]:""].filter(Boolean).join("  ");ctape()}
function ctape(){const T=$("tape");T.hidden=!CL.tape;if(!CL.tape)return;
 T.innerHTML=CL.steps.length?CL.steps.map((s,i)=>"<div"+(i===CL.sel?' class="on"':"")+">"+(i+1)+". "+(s.op?SY[s.op]+" ":"")+s.v+(s.pct?" %":"")+"</div>").join(""):"<div>No steps yet</div>"}
function digit(k){fresh();
 if(k==="."){if(CL.e.includes("."))return;CL.e=(CL.e===""||CL.e==="-")?CL.e+"0.":CL.e+".";return}
 if(CL.e.replace(/[-.]/g,"").length+(k==="00"?2:1)>12)return;
 if(/^-?0$/.test(CL.e))CL.e=CL.e.slice(0,-1);if((CL.e===""||CL.e==="-")&&k==="00")k="0";CL.e+=k}
function oper(o){if(CL.e!==""){const v=parseFloat(CL.e);
  if(CL.op!==null&&CL.acc!==null){cpush({op:CL.op,v});setAcc(ap(CL.acc,CL.op,v))}else{if(CL.eq)CL.steps=[];cpush({op:"",v});CL.acc=v}}
 else if(CL.acc===null)CL.acc=0;CL.op=o;CL.e="";CL.eq=false}
function equals(gt){
 if(CL.e!==""){const v=parseFloat(CL.e);if(CL.op!==null&&CL.acc!==null){cpush({op:CL.op,v});CL.lastOp=CL.op;CL.lastB=v;setAcc(ap(CL.acc,CL.op,v))}else{cpush({op:"",v});CL.acc=v;CL.lastOp=null}}
 else if(CL.op!==null&&CL.acc!==null){CL.lastOp=CL.op;CL.lastB=CL.acc;setAcc(ap(CL.acc,CL.op,CL.acc))}
 else if(CL.eq&&CL.lastOp){setAcc(ap(CL.acc,CL.lastOp,CL.lastB))}
 else if(CL.acc===null)CL.acc=0;
 CL.op=null;CL.e="";CL.eq=true;if(gt&&!CL.err)CL.gt+=CL.acc}
function press(k){const P=CL.prev;CL.prev=k;if(CL.err&&k!=="AC"&&k!=="C")return;
 if(/^(\d|00|\.)$/.test(k))digit(k);else if("+-*/".includes(k))oper(k);else switch(k){
 case"=":equals(true);break;
 case"AC":Object.assign(CL,{e:"",acc:null,op:null,eq:false,steps:[],sel:-1,tape:false,err:false,lastOp:null,lastB:null});break;
 case"C":CL.e="";CL.err=false;if(CL.acc===null)CL.op=null;break;
 case"BS":if(CL.e!=="")CL.e=CL.e.slice(0,-1);if(CL.e==="-")CL.e="";break;
 case"SIGN":if(CL.e!=="")CL.e=CL.e[0]==="-"?CL.e.slice(1):"-"+CL.e;else if(CL.acc!==null)CL.acc=-CL.acc;break;
 case"SQRT":{const v=CL.e!==""?parseFloat(CL.e):(CL.acc===null?0:CL.acc);if(v<0)CL.err=true;else{fresh();CL.e=fmtN(Math.sqrt(v))}break}
 case"PCT":if(CL.e!==""&&CL.op!==null&&CL.acc!==null){const b=parseFloat(CL.e);cpush({op:CL.op,v:b,pct:true});setAcc(ap(CL.acc,CL.op,b,true));CL.op=null;CL.e="";CL.eq=true;CL.lastOp=null;if(!CL.err)CL.gt+=CL.acc}
  else if(CL.e!=="")CL.e=fmtN(parseFloat(CL.e)/100);break;
 case"MU":if(CL.e!==""&&CL.acc!==null&&(CL.op==="*"||CL.op==="/")){const b=parseFloat(CL.e);setAcc(CL.op==="*"?CL.acc*(1+b/100):CL.acc/(1-b/100));CL.op=null;CL.e="";CL.eq=true;CL.lastOp=null}break;
 case"M+":case"M-":equals(false);if(!CL.err)CL.mem+=(k==="M+"?1:-1)*CL.acc;break;
 case"MRC":if(P==="MRC")CL.mem=0;else{fresh();CL.e=fmtN(CL.mem)}break;
 case"GT":if(P==="GT")CL.gt=0;else{fresh();CL.e=fmtN(CL.gt)}break;
 case"DISP":CL.sep=!CL.sep;break;
 case"REV":CL.tape=!CL.tape;CL.sel=CL.tape&&CL.steps.length?CL.steps.length-1:-1;break;
 case"UP":case"DN":if(!CL.steps.length)break;if(!CL.tape){CL.tape=true;CL.sel=CL.steps.length-1}else CL.sel=Math.max(0,Math.min(CL.steps.length-1,(CL.sel<0?CL.steps.length:CL.sel)+(k==="UP"?-1:1)));break;
 case"CORR":if(CL.sel>=0&&CL.e!==""){const oldAcc=CL.acc;CL.steps[CL.sel].v=parseFloat(CL.e);const newAcc=runSteps(CL.steps);if(Number.isFinite(newAcc)&&oldAcc!==null)CL.gt+=(newAcc-oldAcc);setAcc(newAcc);CL.op=null;CL.e="";CL.eq=true}else CL.e="";break}
 cshow()}

 B("7","7")+B("8","8")+B("9","9")+B("%","PCT")+B("C","C","pu")+B("AC","AC","pu")+
 B("4","4")+B("5","5")+B("6","6")+B("\u00d7","*")+B("\u00f7","/")+B("MRC","MRC","sm")+
 B("1","1")+B("2","2")+B("3","3")+B("+","+","p")+B("\u2212","-")+B("M\u2212","M-","sm")+
 B("0","0")+B("00","00")+B(".",".")+B("=","=")+B("M+","M+","sm")+'</div></div>'}

 const m={Enter:"=","=":"=",Backspace:"BS",Escape:"AC",Delete:"C","%":"PCT"}[e.key]||(/^[0-9.+\-*\/]$/.test(e.key)?e.key:null);if(m){e.preventDefault();press(m)}});
